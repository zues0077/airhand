name: Build Android (relay-switch)

# 和桌面版同批发：同一个 v*-relay-switch tag 触发，APK 挂到同一个 release。
# workflow_dispatch 手动触发只编译验证，绝不上传 release（见 Upload 步骤的 if 门控）。
on:
  push:
    tags: ['v*-relay-switch']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 供步骤级 if 判断：没配签名 Secrets 时为 false，走 debug 签名（编译验证用）
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # ubuntu-latest 镜像已预装 Android SDK，但 sdkmanager 不在 PATH 里，
      # 要用 $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager 这个绝对路径。
      # 不用 android-actions/setup-android@v3：它内部安装已被新版 SDK 移除的 tools 包会失败。
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME"
            ls -la "$ANDROID_HOME" || true
            exit 1
          fi
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Rust Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      # Secrets 只存文本：keystore 二进制用 base64 还原成文件。
      # 没配 Secrets（例如手动 dispatch 只做编译验证）时跳过，build.gradle.kts 自动用 debug 签名。
      - name: Restore signing keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/airhand-release.jks"
          chmod 600 "$RUNNER_TEMP/airhand-release.jks"
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease
        env:
          AIRHAND_SERVER: airhand.fnosliu.de5.net:52141
          AIRHAND_SERVER_FP: a27582a2522417fe6058e545592ec289fedcf67a0575909783441c897ecb2abf
          # 没配 Secrets 时不设 AIRHAND_KEYSTORE，build.gradle.kts 的 setting() 收到空值 → 用 debug 签名
          AIRHAND_KEYSTORE: ${{ env.HAS_KEYSTORE == 'true' && format('{0}/airhand-release.jks', runner.temp) || '' }}
          AIRHAND_KEYSTORE_PASSWORD: ${{ secrets.AIRHAND_KEYSTORE_PASSWORD }}
          AIRHAND_KEY_ALIAS: ${{ secrets.AIRHAND_KEY_ALIAS }}
          AIRHAND_KEY_PASSWORD: ${{ secrets.AIRHAND_KEY_PASSWORD }}
      # 只有打 v* tag 才发版；手动 dispatch 编译验证时绝不创建 release
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
