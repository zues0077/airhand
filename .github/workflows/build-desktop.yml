name: Build Desktop (relay-switch)

# 桌面版 + 安卓版由同一个 v*-relay-switch tag 触发，产物挂到同一个 release。
# workflow_dispatch 手动触发只编译验证，绝不上传 release（见 Upload 步骤的 if 门控）。
on:
  push:
    tags: ['v*-relay-switch']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend deps
        working-directory: client
        run: npm ci
      - name: Build NSIS installer
        working-directory: client
        run: npm run tauri build
        env:
          # 编译进程序的默认中转：装完默认连自建，设置里可一键切公共
          AIRHAND_SERVER: airhand.fnosliu.de5.net:52141
          AIRHAND_SERVER_FP: a27582a2522417fe6058e545592ec289fedcf67a0575909783441c897ecb2abf
      # 只有打 v* tag 才发版；手动 dispatch 编译验证时绝不创建 release
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: client/src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
